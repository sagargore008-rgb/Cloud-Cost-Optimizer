services:

  postgres:
    image: postgres:18
    container_name: cloud-cost-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloud_cost_optimizer

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d cloud_cost_optimizer"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  backend:
    build:
      context: ./backend

    container_name: cloud-cost-backend

    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/cloud_cost_optimizer"
      AWS_DEFAULT_REGION: us-east-1

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend

    container_name: cloud-cost-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  postgres_data: