apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloud-cost-optimizer

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 103533474179.dkr.ecr.us-east-1.amazonaws.com/cloud-cost-optimizer-frontend:v3

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloud-cost-optimizer

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80

  type: LoadBalancer